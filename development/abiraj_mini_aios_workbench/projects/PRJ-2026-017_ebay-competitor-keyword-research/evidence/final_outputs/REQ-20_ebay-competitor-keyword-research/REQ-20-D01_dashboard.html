*{box-sizing:border-box}
html,body{height:100%}

.brandmark p{margin:1px 0 0;font-size:11.5px;color:var(--muted)}
.stats{display:flex;gap:22px;margin-left:auto;flex-wrap:wrap}
.stat .v{font-size:19px;font-weight:800;color:var(--brand);line-height:1}

.search{display:flex;align-items:center;gap:7px;background:var(--bg);border:1px solid var(--line);

thead th{position:sticky;top:0;z-index:4;background:#f4f7fc;color:var(--muted);text-align:left;

 padding:11px 14px;border-bottom:2px solid var(--band-line);white-space:nowrap}
th.num,td.num{text-align:right}
tbody td{padding:10px 14px;border-bottom:1px solid var(--line);vertical-align:middle}
tr.comp:hover td{background:#f7faff}
tr.comp:nth-child(even of .comp) td{background:#fbfcfe}
.grp td{padding:0;border-bottom:0}
.grpband{background:var(--band);border-top:1px solid var(--band-line);border-bottom:1px solid var(--band-line);
 padding:12px 16px;display:flex;flex-wrap:wrap;gap:10px 20px;align-items:center}
.grpband .gname{font-size:15px;font-weight:800;letter-spacing:-.2px;display:flex;align-items:center;gap:9px}
.gbar{width:5px;height:20px;border-radius:3px;background:linear-gradient(180deg,var(--brand),var(--brand2))}
.gcount{background:#fff;border:1px solid var(--band-line);border-radius:999px;padding:3px 10px;font-size:11px;font-weight:700;color:var(--brand)}
.gsku{font-size:11px;color:var(--muted);font-family:ui-monospace,Menlo,Consolas,monospace}
.kws{display:flex;flex-wrap:wrap;gap:6px 14px;margin-left:auto;align-items:center}
.kwgrp{display:flex;flex-wrap:wrap;gap:4px;align-items:center}
.kwlabel{font-size:9.5px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin-right:2px}
.kw{padding:3px 8px;border-radius:6px;font-size:11px;font-weight:600;border:1px solid transparent}
.kw.p{background:var(--chipP);color:var(--brand);border-color:#d5e2f7}
.kw.s{background:var(--chipS);color:var(--green);border-color:#cdebd9}
.kw.l{background:var(--chipL);color:var(--pink);border-color:#f6d8e2}
.seller{font-weight:700}.seller a{color:var(--ink);text-decoration:none}.seller a:hover{color:var(--brand)}
.brand{color:var(--muted);font-size:11.5px;margin-top:1px}
.ttl{max-width:340px;color:#33455c}
.soldc{min-width:120px}.soldn{font-weight:800}
.bar{height:6px;border-radius:5px;background:#e9eef6;overflow:hidden;margin-top:5px}
.bar>i{display:block;height:100%;border-radius:5px;background:linear-gradient(90deg,var(--brand),var(--brand2));width:0;transition:width 1s cubic-bezier(.2,.8,.2,1)}
.price{font-weight:800;white-space:nowrap}
.fb{display:flex;align-items:center;gap:7px;white-space:nowrap;font-weight:600}
.fbdot{width:8px;height:8px;border-radius:50%}
.tag{display:inline-block;padding:3px 9px;border-radius:999px;font-size:10.5px;font-weight:700;white-space:nowrap}
.tag.free{background:#e7f6ee;color:var(--green)}.tag.paid{background:#eef2f7;color:var(--muted)}
.tag.promo{background:#fdf1e3;color:var(--amber)}.tag.none{color:#b7c2d0}
tr.hide{display:none}
.rank{color:var(--muted);font-weight:800;font-size:12px}
.empty{padding:50px;text-align:center;color:var(--muted)}
@media(max-width:820px){.stats{gap:14px}.ttl{max-width:180px}.kws{width:100%;margin-left:0}}
