<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LEDsOne — Business OS Configurator v5.0</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'DM Sans',system-ui,sans-serif;background:#f4f4f0;color:#1a1a18}
.config-wrap{min-height:100vh;background:#f4f4f0}
.topbar{position:sticky;top:0;z-index:100;background:#fff;border-bottom:1px solid #e8e8e4;display:flex;align-items:center;justify-content:space-between;padding:0 24px;height:52px;box-shadow:0 1px 2px rgba(0,0,0,0.06)}
.topbar-left{display:flex;align-items:center;gap:12px}
.topbar-title{font-size:13px;font-weight:700;color:#c0392b;text-transform:uppercase;letter-spacing:0.06em}
.topbar-sub{font-size:11px;color:#9a9a95;font-family:'DM Mono',monospace}
.live-dot{width:7px;height:7px;border-radius:50%;background:#27ae60;animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:0.4}}
.btn{display:inline-flex;align-items:center;gap:6px;padding:7px 14px;border-radius:5px;font-size:12px;font-weight:600;cursor:pointer;border:none;transition:all 0.15s}
.btn-primary{background:#c0392b;color:#fff}.btn-primary:hover{background:#a93226}
.btn-ghost{background:transparent;color:#5a5a55;border:1px solid #e8e8e4}.btn-ghost:hover{background:#f4f4f0}
.main-layout{display:flex;height:calc(100vh - 52px)}
.sidebar{width:220px;background:#fff;border-right:1px solid #e8e8e4;padding:12px 0;flex-shrink:0;overflow-y:auto}
.sidebar-label{font-size:10px;font-weight:700;color:#9a9a95;text-transform:uppercase;letter-spacing:0.08em;padding:12px 14px 5px}
.nav-item{display:flex;align-items:center;gap:8px;padding:7px 12px;border-radius:5px;cursor:pointer;font-size:12px;font-weight:500;color:#5a5a55;transition:all 0.15s;margin:1px 4px}
.nav-item:hover{background:#f4f4f0;color:#1a1a18}
.nav-item.active{background:#fdecea;color:#c0392b;font-weight:600}
.nav-icon{font-size:13px;flex-shrink:0;width:18px;text-align:center}
.nav-badge{margin-left:auto;color:#fff;font-size:10px;font-weight:700;padding:1px 6px;border-radius:10px;background:#f39c12}
.content{flex:1;overflow-y:auto;padding:24px}
.page-header{margin-bottom:20px}
.page-title{font-size:15px;font-weight:700;color:#c0392b;text-transform:uppercase;letter-spacing:0.02em}
.page-desc{font-size:12px;color:#5a5a55;margin-top:4px;line-height:1.55}
.thr-card{background:#fff;border:1px solid #e8e8e4;border-radius:5px;margin-bottom:12px;overflow:hidden;box-shadow:0 1px 2px rgba(0,0,0,0.04)}
.thr-card-head{padding:12px 16px;border-bottom:1px solid #e8e8e4;display:flex;align-items:center;justify-content:space-between;background:#fafaf8}
.thr-card-title{font-size:12px;font-weight:700;color:#1a1a18;text-transform:uppercase;letter-spacing:0.06em}
.thr-card-body{padding:16px}
.thr-field{display:flex;flex-direction:column;gap:4px}
.thr-field-label{font-size:11px;font-weight:600;color:#5a5a55;text-transform:uppercase;letter-spacing:0.05em}
.thr-field-key{font-size:10px;font-family:'DM Mono',monospace;color:#b0b0aa}
.thr-field-note{font-size:11px;color:#9a9a95;line-height:1.4;margin-top:2px}
.thr-field-rule{font-size:10px;font-family:'DM Mono',monospace;color:#2980b9;margin-top:2px}
.thr-row{display:grid;gap:12px;margin-bottom:12px}
.thr-row-2{grid-template-columns:1fr 1fr}
.thr-row-3{grid-template-columns:1fr 1fr 1fr}
.thr-row-4{grid-template-columns:1fr 1fr 1fr 1fr}
.save-bar{display:flex;align-items:center;justify-content:space-between;background:#fff;border:1px solid #e8e8e4;border-radius:5px;padding:10px 16px;margin-bottom:16px;position:sticky;top:0;z-index:10}
.save-bar-info{font-size:12px;color:#5a5a55}
.changed-dot{width:6px;height:6px;border-radius:50%;background:#f39c12;display:inline-block;margin-right:5px}
.form-input{width:100%;padding:8px 10px;border:1px solid #e8e8e4;border-radius:5px;font-size:12px;font-family:'DM Sans',sans-serif;color:#1a1a18;background:#fff;outline:none;transition:border 0.15s}
.form-input:focus{border-color:#c0392b;box-shadow:0 0 0 2px rgba(192,57,43,0.08)}
.form-input.changed{border-color:#f39c12;background:#fef6e7}
.input-with-suffix{display:flex;align-items:center}
.input-with-suffix .form-input{border-radius:5px 0 0 5px;flex:1}
.input-suffix{background:#f4f4f0;border:1px solid #e8e8e4;border-left:none;border-radius:0 5px 5px 0;padding:8px 10px;font-size:11px;color:#9a9a95;white-space:nowrap}
.info-banner{background:#eaf4fb;border:1px solid #b3d4ec;border-radius:5px;padding:10px 14px;font-size:12px;color:#1a5276;line-height:1.6;margin-bottom:16px}
.rule-ref-tag{display:inline-block;font-size:10px;font-family:'DM Mono',monospace;background:#eaf4fb;color:#2980b9;border:1px solid #b3d4ec;padding:1px 6px;border-radius:3px;margin-right:4px}
::-webkit-scrollbar{width:5px;height:5px}
::-webkit-scrollbar-track{background:#f4f4f0}
::-webkit-scrollbar-thumb{background:#e8e8e4;border-radius:3px}
.stats-row{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-bottom:20px}
.stat-card{background:#fff;border:1px solid #e8e8e4;border-radius:5px;padding:14px 16px}
.stat-val{font-size:22px;font-weight:700}
.stat-label{font-size:11px;color:#9a9a95;margin-top:3px;text-transform:uppercase;letter-spacing:0.06em}
.stat-card.b-red{border-top:3px solid #e74c3c}
.stat-card.b-amber{border-top:3px solid #f39c12}
.stat-card.b-green{border-top:3px solid #27ae60}
.stat-card.b-blue{border-top:3px solid #2980b9}
.stat-card.b-purple{border-top:3px solid #7e22ce}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect } = React;

const OIL_DEFAULTS = {
  // MARGIN BANDS — confirmed Amazon FBM Apr 2026
  band_red_max:0,band_amber_min:0,band_amber_max:3,band_yellow_min:4,band_yellow_max:8,
  band_dkgreen_min:9,band_dkgreen_max:15,band_purple_min:16,
  hips_min_revenue:2000,hips_min_margin_pct:22,hips_kill_margin_pct:12,
  hips_kill_consecutive_months:2,hips_review_cycle_days:30,hips_data_required_months:3,
  cppc_amazon:18,cppc_ebay:14,cppc_shopify:12,cppc_wayfair:22,
  cppc_review_cycle_days:30,cppc_kill_multiplier:1.5,cppc_kill_consecutive_months:3,
  nnv_review_period_days:30,nnv_improvement_window_days:14,
  nnv_kill_consecutive_periods:3,nnv_activity_review_cycle:30,
  oaf_kpi_floor_score:70,oaf_escalation_reviews:2,oaf_kill_reviews:4,
  oaf_review_cycle_days:30,oaf_pip_window_days:30,
  // CHANNEL FEES — confirmed Apr 2026 (Amazon referral updated 15→18%)
  ch_amazon_referral_pct:18,ch_amazon_fba_per_unit:3.20,ch_ebay_fvf_pct:12.35,
  ch_ebay_listing_fee:0.30,ch_shopify_transaction_pct:1.5,ch_shopify_payment_pct:1.7,
  ch_wayfair_commission_pct:23,cogs_pct_of_listing:20,vat_pct:20,
  // AMAZON FBM — confirmed thresholds Apr 2026
  fbm_postage_cost_gbp:2.50,fbm_postage_max_weight_kg:2,fbm_min_aov_gbp:24,
  fbm_refund_allowance_pct:5,fbm_referral_fee_pct:18,
  fbm_dispatch_sla_standard_hrs:24,fbm_label_recon_tolerance_pct:1,
  fbm_min_orders_for_action:10,fbm_return_window_days:30,
  fbm_cancellation_rate_pct:2,fbm_cancellation_window_days:30,
  fbm_return_rate_amazon_pct:4,fbm_return_rate_ebay_pct:3,fbm_return_rate_shopify_pct:2,
  fbm_postage_cap_red_amber_gbp:2.50,fbm_amber_suppress_weeks:4,
  // KPI ESCALATION LEVELS — confirmed Apr 2026
  kpi_measurement_window_days:30,kpi_min_orders_qualification:10,
  kpi_l2_amber_weeks:3,kpi_l2_response_hrs:48,
  kpi_l3_amber_weeks:4,kpi_l4_resolution_hrs:48,kpi_l5_resolution_days:7,
  // PPC — target ACOS updated 22→20% Apr 2026
  ppc_acos_target:20,ppc_acos_escalation_days:14,ppc_wasted_spend_kill_gbp:50,
  ppc_wasted_spend_window_days:30,ppc_wasted_spend_impression_review:5000,
  ppc_search_term_promotion_sales:10,ppc_search_term_promotion_days:14,
  ppc_budget_exhaust_days:3,ppc_budget_increase_pct:20,ppc_new_asin_daily_budget:10,
  ppc_nnv_spend_threshold:200,ppc_seasonal_uplift_pct:30,
  ph_ctr_floor:0.3,ph_cvr_floor:8,ph_suppression_resolution_hrs:24,
  ph_suppression_hips_alert_hrs:1,ph_ctr_trigger_days:7,ph_cvr_trigger_days:7,
  ph_backend_refresh_days_hips:90,ph_backend_refresh_days_standard:180,
  ph_min_images:5,ph_main_image_fill_pct:85,ph_min_image_resolution:1000,ph_aplus_coverage_target:100,
  eby_sell_through_floor:15,eby_price_vs_median_pct:10,eby_defect_rate_warning:1.5,
  eby_defect_rate_penalty:2.0,eby_nnv_zero_sales_days:60,eby_nnv_kill_days:90,
  eby_min_images:6,eby_title_max_chars:80,
  shp_aov_floor:45,shp_aov_target:65,shp_cvr_floor:2.5,shp_cart_abandon_target:65,
  shp_bundle_copurchase_min:20,shp_bundle_discount_pct:10,
  shp_free_shipping_aov_buffer_pct:20,shp_min_images:5,
  way_min_margin_pct:18,way_return_rate_warning:8,way_return_rate_escalate:12,
  way_commission_discrepancy_pct:5,way_nnv_days:90,
  whs_reorder_po_hours:4,whs_dispatch_sla_same_day_cutoff:14,
  whs_pick_accuracy_floor:98,whs_pick_accuracy_target:99.5,
  whs_returns_grading_hours:24,whs_cycle_count_variance_units:10,
  whs_cycle_count_variance_pct:5,whs_lead_time_min_days:120,
  whs_lead_time_max_days:180,whs_oos_risk_days:10,
  cop_response_amazon_target_hrs:12,cop_response_amazon_max_hrs:24,
  cop_response_shopify_target_hrs:8,cop_response_shopify_max_hrs:24,
  cop_refund_self_approval_gbp:75,cop_pattern_threshold_count:5,
  cop_pattern_window_days:7,cop_return_window_days:30,
  cop_review_response_hrs:48,cop_abuse_return_count:4,cop_abuse_window_months:6,
  seo_content_sla_standard_days:5,seo_content_sla_hips_days:2,
  seo_hips_refresh_days:90,seo_meta_title_max:60,seo_meta_desc_max:160,
  seo_ebay_title_max:80,seo_shopify_desc_min_words:150,
  seo_shopify_desc_max_words:300,seo_internal_links_per_page:3,
};

function F({label,k,value,onChange,suffix,hint,rule,type="number",step,changed}){
  return(
    <div className="thr-field">
      <div className="thr-field-label">{label}</div>
      <div className="thr-field-key">{k}</div>
      <div className="input-with-suffix">
        <input className={"form-input"+(changed?" changed":"")} type={type} value={value}
          step={step||(type==="number"?1:undefined)}
          onChange={e=>onChange(k,type==="number"?parseFloat(e.target.value)||0:e.target.value)}/>
        {suffix&&<span className="input-suffix">{suffix}</span>}
      </div>
      {rule&&<div className="thr-field-rule">→ {rule}</div>}
      {hint&&<div className="thr-field-note">{hint}</div>}
    </div>
  );
}

function Card({title,accent="#2980b9",refs=[],intro,children}){
  return(
    <div className="thr-card" style={{borderTop:`3px solid ${accent}`}}>
      <div className="thr-card-head">
        <span className="thr-card-title">{title}</span>
        <div>{refs.map(r=><span key={r} className="rule-ref-tag">{r}</span>)}</div>
      </div>
      <div className="thr-card-body">
        {intro&&<div className="info-banner">{intro}</div>}
        {children}
      </div>
    </div>
  );
}

function Bar({changed,onSave,onReset,msg}){
  return(
    <div className="save-bar">
      <div className="save-bar-info">
        {changed.length>0
          ?<><span className="changed-dot"/>{changed.length} unsaved change{changed.length!==1?"s":""}</>
          :msg||<span style={{color:"#27ae60"}}>✓ All values saved</span>}
      </div>
      <div style={{display:"flex",gap:8}}>
        {changed.length>0&&<button className="btn btn-ghost" onClick={onReset}>Discard</button>}
        <button className="btn btn-primary" onClick={onSave}
          style={{opacity:changed.length===0?0.5:1}} disabled={changed.length===0}>💾 Save Changes</button>
      </div>
    </div>
  );
}

function MarginBands({cfg,update,changed,onSave,onReset,msg}){
  const ch=k=>changed.includes(k);
  return(
    <div className="content">
      <div className="page-header">
        <div className="page-title">Margin Bands — Colour Classification</div>
        <div className="page-desc">Define the profit % boundaries for each colour band. Every SKU, channel, and staff output is scored against these bands. Change a band boundary here — it propagates everywhere.</div>
      </div>
      <Bar changed={changed} onSave={onSave} onReset={onReset} msg={msg}/>
      <div className="stats-row">
        {[
          {label:"Red",val:`< ${cfg.band_red_max}%`,cls:"b-red",color:"#e74c3c"},
          {label:"Amber",val:`${cfg.band_amber_min}–${cfg.band_amber_max}%`,cls:"b-amber",color:"#f39c12"},
          {label:"Yellow",val:`${cfg.band_yellow_min}–${cfg.band_yellow_max}%`,cls:"b-blue",color:"#d4ac0d"},
          {label:"Dark Green",val:`${cfg.band_dkgreen_min}–${cfg.band_dkgreen_max}%`,cls:"b-green",color:"#27ae60"},
          {label:"Purple",val:`> ${cfg.band_purple_min}%`,cls:"b-purple",color:"#7e22ce"},
        ].map(b=>(
          <div key={b.label} className={`stat-card ${b.cls}`}>
            <div className="stat-val" style={{color:b.color}}>{b.val}</div>
            <div className="stat-label">{b.label}</div>
          </div>
        ))}
      </div>
      <div style={{background:"#fff",border:"1px solid #e8e8e4",borderRadius:5,padding:"14px 16px",marginBottom:16}}>
        <div style={{display:"flex",gap:3,height:12,borderRadius:3,overflow:"hidden"}}>
          {[["#e74c3c",cfg.band_amber_max],["#f39c12",cfg.band_yellow_max-cfg.band_amber_max],
            ["#d4ac0d",cfg.band_dkgreen_min-cfg.band_yellow_min],
            ["#27ae60",cfg.band_purple_min-cfg.band_dkgreen_min],["#7e22ce",100-cfg.band_purple_min]
          ].map(([c,w],i)=>(
            <div key={i} style={{background:c,flex:Math.max(w,3),borderRadius:i===0?"3px 0 0 3px":i===4?"0 3px 3px 0":0}}/>
          ))}
        </div>
        <div style={{display:"flex",justifyContent:"space-between",marginTop:6,fontSize:10,color:"#9a9a95",fontFamily:"'DM Mono',monospace"}}>
          <span>0%</span><span style={{color:"#f39c12"}}>{cfg.band_amber_max}%</span>
          <span style={{color:"#d4ac0d"}}>{cfg.band_yellow_max}%</span>
          <span style={{color:"#27ae60"}}>{cfg.band_dkgreen_max}%</span>
          <span style={{color:"#7e22ce"}}>{cfg.band_purple_min}%+</span>
        </div>
      </div>
      <Card title="Margin Band Boundaries" accent="#c0392b" refs={["HIPS-001","NNV-001","CPPC-001"]}
        intro="All percentage values refer to net profit margin (%). Each band boundary feeds into HIPS classification, NNV screening, and the colour-coded output across all dashboards.">
        <div className="thr-row thr-row-2">
          <F label="Red — below this % = loss" k="band_red_max" value={cfg.band_red_max} onChange={update} suffix="%" hint="Below 0 = negative net contribution" rule="NNV-001" changed={ch("band_red_max")}/>
          <F label="Amber — max boundary" k="band_amber_max" value={cfg.band_amber_max} onChange={update} suffix="%" hint="0 to this% = low margin, watch zone" rule="HIPS-001" changed={ch("band_amber_max")}/>
        </div>
        <div className="thr-row thr-row-2">
          <F label="Yellow — max boundary" k="band_yellow_max" value={cfg.band_yellow_max} onChange={update} suffix="%" hint="Functional, not optimised" changed={ch("band_yellow_max")}/>
          <F label="Dark Green — max boundary" k="band_dkgreen_max" value={cfg.band_dkgreen_max} onChange={update} suffix="%" hint="Strong — target band for HIPS SKUs" rule="HIPS-001" changed={ch("band_dkgreen_max")}/>
        </div>
        <div className="thr-row thr-row-2">
          <F label="Purple — above this % = exceptional" k="band_purple_min" value={cfg.band_purple_min} onChange={update} suffix="%" hint="Above 40% = leading edge margin" changed={ch("band_purple_min")}/>
          <div/>
        </div>
      </Card>
      <Card title="COGS and VAT Standards" accent="#9a9a95"
        intro="COGS = 20% of listing price. VAT = 20% of selling price. Update if supplier terms change.">
        <div className="thr-row thr-row-2">
          <F label="COGS as % of listing price" k="cogs_pct_of_listing" value={cfg.cogs_pct_of_listing} onChange={update} suffix="%" hint="Landed cost. Update if supplier terms change." changed={ch("cogs_pct_of_listing")}/>
          <F label="VAT rate" k="vat_pct" value={cfg.vat_pct} onChange={update} suffix="%" hint="Standard UK VAT rate" changed={ch("vat_pct")}/>
        </div>
      </Card>
    </div>
  );
}

function SKUEcon({cfg,update,changed,onSave,onReset,msg}){
  const ch=k=>changed.includes(k);
  return(
    <div className="content">
      <div className="page-header">
        <div className="page-title">SKU Economics — HIPS, NNV & OAF</div>
        <div className="page-desc">Core business logic thresholds for SKU classification, negative net value screening, and staff accountability.</div>
      </div>
      <Bar changed={changed} onSave={onSave} onReset={onReset} msg={msg}/>
      <Card title="HIPS — High Impact Profit SKU Qualification" accent="#c0392b" refs={["HIPS-001"]}
        intro="A SKU qualifies as HIPS only when BOTH conditions are met: revenue ≥ floor AND margin ≥ floor. HIPS SKUs receive priority ad spend, inventory protection, and daily attention.">
        <div className="thr-row thr-row-3">
          <F label="Min monthly revenue" k="hips_min_revenue" value={cfg.hips_min_revenue} onChange={update} suffix="£/mo" rule="HIPS-001 trigger" hint="Below this = standard tier regardless of margin" changed={ch("hips_min_revenue")}/>
          <F label="Min net margin % to qualify" k="hips_min_margin_pct" value={cfg.hips_min_margin_pct} onChange={update} suffix="%" rule="HIPS-001 trigger" changed={ch("hips_min_margin_pct")}/>
          <F label="Review cycle" k="hips_review_cycle_days" value={cfg.hips_review_cycle_days} onChange={update} suffix="days" changed={ch("hips_review_cycle_days")}/>
        </div>
        <div className="thr-row thr-row-3">
          <F label="Kill condition — margin below" k="hips_kill_margin_pct" value={cfg.hips_kill_margin_pct} onChange={update} suffix="%" rule="HIPS-001 kill" changed={ch("hips_kill_margin_pct")}/>
          <F label="Kill — consecutive months" k="hips_kill_consecutive_months" value={cfg.hips_kill_consecutive_months} onChange={update} suffix="months" rule="HIPS-001 kill" changed={ch("hips_kill_consecutive_months")}/>
          <F label="Data required before classification" k="hips_data_required_months" value={cfg.hips_data_required_months} onChange={update} suffix="months" hint="Prevents premature classification" changed={ch("hips_data_required_months")}/>
        </div>
      </Card>
      <Card title="NNV — Negative Net Value Screening" accent="#e74c3c" refs={["NNV-001"]}
        intro="Any task, role, SKU, campaign, or channel with zero or negative net contribution is flagged NNV. Improvement window runs before kill recommendation is made.">
        <div className="thr-row thr-row-4">
          <F label="Review period" k="nnv_review_period_days" value={cfg.nnv_review_period_days} onChange={update} suffix="days" rule="NNV-001 trigger" changed={ch("nnv_review_period_days")}/>
          <F label="Improvement window" k="nnv_improvement_window_days" value={cfg.nnv_improvement_window_days} onChange={update} suffix="days" rule="NNV-001 action" hint="Days to fix before kill recommendation" changed={ch("nnv_improvement_window_days")}/>
          <F label="Consecutive periods before kill" k="nnv_kill_consecutive_periods" value={cfg.nnv_kill_consecutive_periods} onChange={update} suffix="periods" rule="NNV-001 kill" changed={ch("nnv_kill_consecutive_periods")}/>
          <F label="Activity review cycle" k="nnv_activity_review_cycle" value={cfg.nnv_activity_review_cycle} onChange={update} suffix="days" changed={ch("nnv_activity_review_cycle")}/>
        </div>
      </Card>
      <Card title="OAF — Staff Operational Accountability" accent="#f39c12" refs={["OAF-001"]}
        intro="Every staff role has a KPI floor score. Falling below it for N consecutive reviews triggers escalation. This governs the monthly boardroom review pack.">

function AmazonFBM({cfg,update,changed,onSave,onReset,msg}){
  const ch=k=>changed.includes(k);
  const band=(v)=>{
    if(v<cfg.band_red_max)return{label:"Red",color:"#e74c3c"};
    if(v<=cfg.band_amber_max)return{label:"Amber",color:"#f39c12"};
    if(v<=cfg.band_yellow_max)return{label:"Yellow",color:"#d4ac0d"};
    if(v<=cfg.band_dkgreen_max)return{label:"Dark Green",color:"#27ae60"};
    return{label:"Purple",color:"#7e22ce"};
  };
  const estNet=()=>{
    const gross=100;
    const n=gross-cfg.cogs_pct_of_listing-cfg.vat_pct-cfg.fbm_referral_fee_pct-cfg.ppc_acos_target-cfg.fbm_refund_allowance_pct-((cfg.fbm_postage_cost_gbp/cfg.fbm_min_aov_gbp)*100);

  };
  const net=estNet();

function KPILevels({cfg,update,changed,onSave,onReset,msg}){

      <Card title="Non-Negotiable Rules" accent="#9a9a95">
        {[
          ["01","Levels are sequential","A SKU moves through levels in order. You cannot skip from L1 to L4 unless the L4 trigger is independently met."],
          ["02","Written response mandatory at L2 and above","Verbal acknowledgement not accepted. Response logged in KPI system within the defined window."],
          ["03","Thresholds are fixed","No Team Leader or developer may alter a threshold. All changes require Business Owner sign-off."],
          ["04","Framework applies to staff output as well as SKUs","Staff weekly ROI output below defined band triggers the same level structure."],
        ].map(([n,bold,normal])=>(
          <div key={n} style={{display:"flex",gap:12,padding:"10px 0",borderBottom:"1px solid #e8e8e4"}}>
            <div style={{fontFamily:"'DM Mono',monospace",fontSize:12,fontWeight:700,color:"#c0392b",minWidth:24}}>{n}</div>
            <div style={{fontSize:12,color:"#1a1a18",lineHeight:1.6}}><strong>{bold} — </strong>{normal}</div>
          </div>
        ))}
      </Card>
    </div>
  );
}

function ExportPage({allCfg}){
  const [copied,setCopied]=useState(false);
  const sections=[
    {label:"Margin Bands",prefix:["band_","cogs_","vat_"]},
    {label:"HIPS / NNV / OAF",prefix:["hips_","nnv_","oaf_"]},
    {label:"Amazon FBM",prefix:["fbm_"]},
    {label:"KPI Levels",prefix:["kpi_"]},
    {label:"Channel Fees + CPPC",prefix:["ch_","cppc_"]},
    {label:"Amazon PPC",prefix:["ppc_"]},
    {label:"Amazon PH",prefix:["ph_"]},
    {label:"eBay Organic",prefix:["eby_"]},
    {label:"Shopify DTC",prefix:["shp_"]},
    {label:"Wayfair",prefix:["way_"]},
    {label:"Warehouse",prefix:["whs_"]},
    {label:"Customer Ops",prefix:["cop_"]},
    {label:"SEO / Content",prefix:["seo_"]},
  ].map(s=>({...s,keys:Object.keys(OIL_DEFAULTS).filter(k=>s.prefix.some(p=>k.startsWith(p)))}));
  const yaml=Object.entries(allCfg).map(([k,v])=>`${k}: ${v}`).join("\n");
  const copy=()=>{navigator.clipboard.writeText(yaml).then(()=>{setCopied(true);setTimeout(()=>setCopied(false),2000);});};
  const dl=()=>{const b=new Blob([yaml],{type:"text/yaml"});const a=document.createElement("a");a.href=URL.createObjectURL(b);a.download="rules_registry.yaml";a.click();};
  return(
    <div className="content">
      <div className="page-header">
        <div className="page-title">Export — rules_registry.yaml</div>
        <div className="page-desc">Copy the current configuration as YAML. Paste into registries/rules_registry.yaml in your /business-os/ folder. This is the single source of truth that all AI agents and N8N workflows read at runtime.</div>
      </div>
      <div style={{display:"flex",gap:10,marginBottom:20}}>
        <button className="btn btn-primary" onClick={copy}>{copied?"✓ Copied!":"📋 Copy YAML"}</button>
        <button className="btn btn-ghost" onClick={dl}>⬇ Download .yaml</button>
      </div>
      {sections.map(sec=>(
        <div key={sec.label} className="thr-card" style={{borderTop:"3px solid #2980b9",marginBottom:10}}>
          <div className="thr-card-head">
            <span className="thr-card-title">{sec.label}</span>
            <span style={{fontSize:11,color:"#9a9a95"}}>{sec.keys.length} keys</span>
          </div>
          <div className="thr-card-body">
            <div style={{fontFamily:"'DM Mono',monospace",fontSize:11,lineHeight:1.8,background:"#f4f4f0",padding:"10px 14px",borderRadius:5}}>
              {sec.keys.map(k=>(
                <div key={k} style={{display:"flex",gap:16}}>
                  <span style={{color:"#2980b9",minWidth:280}}>{k}:</span>
                  <span style={{color:"#c0392b"}}>{allCfg[k]}</span>
                </div>
              ))}
            </div>
          </div>
        </div>
      ))}
    </div>
  );
}

function App(){
  const [page,setPage]=useState("margin-bands");
  const [cfg,setCfg]=useState({...OIL_DEFAULTS});
  const [saved,setSaved]=useState({...OIL_DEFAULTS});
  const [msg,setMsg]=useState("");
  const update=(k,v)=>setCfg(c=>({...c,[k]:v}));
  const changed=Object.keys(cfg).filter(k=>cfg[k]!==saved[k]);
  const save=()=>{
    setSaved({...cfg});
    setMsg(`${changed.length} value${changed.length!==1?"s":""} saved`);
    setTimeout(()=>setMsg(""),3000);
    try{localStorage.setItem("oil_config_v5",JSON.stringify(cfg));}catch(e){}
  };
  const reset=()=>setCfg({...saved});
  useEffect(()=>{
    try{const v=localStorage.getItem("oil_config_v5");if(v){const p=JSON.parse(v);setCfg(p);setSaved(p);}}catch(e){}
  },[]);
  const pp={cfg,update,changed,onSave:save,onReset:reset,msg};
  const nav=[
    {group:"OIL Core Rules",items:[
      {id:"margin-bands",icon:"🎨",label:"Margin Bands"},
      {id:"sku-economics",icon:"📊",label:"SKU Economics"},
      {id:"channel-policies",icon:"🌐",label:"Channel Policies"},
    ]},
    {group:"Channel Domain Packs",items:[
      {id:"amazon-fbm",icon:"📦",label:"Amazon FBM"},
      {id:"kpi-levels",icon:"🚦",label:"KPI Levels"},
    ]},
    {group:"Skill Pack Thresholds",items:[
      {id:"amazon-ppc",icon:"⚡",label:"Amazon PPC"},
      {id:"amazon-ph",icon:"🖼",label:"Amazon PH"},
      {id:"ebay-organic",icon:"🛒",label:"eBay Organic"},
      {id:"shopify-dtc",icon:"🛍",label:"Shopify DTC"},
      {id:"wayfair",icon:"🏠",label:"Wayfair"},
      {id:"warehouse",icon:"📦",label:"Warehouse"},
      {id:"customer-ops",icon:"💬",label:"Customer Ops"},
      {id:"seo-content",icon:"✍️",label:"SEO / Content"},
    ]},
    {group:"System",items:[
      {id:"export",icon:"📤",label:"Export YAML"},
    ]},
  ];
  const total=changed.length;
  return(
    <div className="config-wrap">
      <div className="topbar">
        <div className="topbar-left">
          <div className="live-dot"/>
          <span className="topbar-title">LEDsOne — Business OS Configurator</span>
          <span className="topbar-sub">v5.0 · OIL rules_registry · {Object.keys(OIL_DEFAULTS).length} configurable values{total>0?` · ${total} unsaved`:""}</span>
        </div>
        <div style={{display:"flex",gap:8,alignItems:"center"}}>
          {total>0&&<span style={{fontSize:11,color:"#f39c12",fontWeight:600}}><span className="changed-dot"/>{total} unsaved</span>}
          <button className="btn btn-ghost" style={{fontSize:11}} onClick={()=>setPage("export")}>📤 Export YAML</button>
          <button className="btn btn-primary" style={{fontSize:11,opacity:total===0?0.5:1}} onClick={save} disabled={total===0}>💾 Save All</button>
        </div>
      </div>
      <div className="main-layout">
        <div className="sidebar">
          {nav.map(g=>(
            <div key={g.group}>
              <div className="sidebar-label">{g.group}</div>
              {g.items.map(n=>(
                <div key={n.id} className={"nav-item"+(page===n.id?" active":"")} onClick={()=>setPage(n.id)}>
                  <span className="nav-icon">{n.icon}</span>
                  <span>{n.label}</span>
                  {n.id==="export"&&total>0&&<span className="nav-badge">{total}</span>}
                </div>
              ))}
            </div>
          ))}
        </div>
        {page==="amazon-fbm"&&<AmazonFBM {...pp}/>}
        {page==="kpi-levels"&&<KPILevels {...pp}/>}
        {page==="margin-bands"&&<MarginBands {...pp}/>}
        {page==="sku-economics"&&<SKUEcon {...pp}/>}
        {page==="channel-policies"&&<ChannelPol {...pp}/>}
        {page==="amazon-ppc"&&<AmazonPPC {...pp}/>}
        {page==="amazon-ph"&&<AmazonPH {...pp}/>}
        {page==="ebay-organic"&&<EbayOrganic {...pp}/>}
        {page==="shopify-dtc"&&<ShopifyDTC {...pp}/>}
        {page==="wayfair"&&<Wayfair {...pp}/>}
        {page==="warehouse"&&<Warehouse {...pp}/>}
        {page==="customer-ops"&&<CustomerOps {...pp}/>}
        {page==="seo-content"&&<SEOContent {...pp}/>}
        {page==="export"&&<ExportPage allCfg={cfg}/>}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
